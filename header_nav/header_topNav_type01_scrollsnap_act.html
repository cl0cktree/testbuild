<!DOCTYPE html>
<html lang="kr" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>snap scroll sample</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="header type01_scrollsnap_act">
        <h1>
            <a href="" tab-index="1" aria-hidden="false">
                Logo
                <!-- <img src="/images/logo_jgbd.png" alt="mainlogo - 클릭시 메인페이지로 이동"> -->
            </a>
        </h1>

        <nav class="nav_wrap">
            <ul class="navi">
                <li data-index="1">
                    <a href="#article_1" tab-index="1" aria-hidden="false">article1</a>
                </li>
                <li data-index="2">
                    <a href="#article_2" tab-index="1" aria-hidden="false">article2</a>
                </li>
                <li data-index="3">
                    <a href="#article_3" tab-index="1" aria-hidden="false">article3</a>
                </li>
                <li data-index="4">
                    <a href="#article_4" tab-index="1" aria-hidden="false">article4</a>
                </li>
                <li data-index="5">
                    <a href="#article_5" tab-index="1" aria-hidden="false">article5</a>
                </li>
            </ul>
        </nav>
        <nav class="nav_mobile_wrap">
            <ul class="nav_mobile">
                <li data-index="1">
                    <a href="#article_1" tab-index="1" aria-hidden="false">article1</a>
                </li>
                <li data-index="2">
                    <a href="#article_2" tab-index="1" aria-hidden="false">article2</a>
                </li>
                <li data-index="3">
                    <a href="#article_3" tab-index="1" aria-hidden="false">article3</a>
                </li>
                <li data-index="4">
                    <a href="#article_4" tab-index="1" aria-hidden="false">article4</a>
                </li>
                <li data-index="5">
                    <a href="#article_5" tab-index="1" aria-hidden="false">article5</a>
                </li>
            </ul>
        </nav>
        <h2>
            <button id="menu_btn" class="menu_btn" tab-index="1" aria-hidden="false" aria-label="메뉴버튼" value="메뉴버튼">
                <span>
                    메뉴버튼
                </span>
            </button>
        </h2>
    </header>

    <div class="section scrollsnap_act" id="section">
      <div class="article art_1" id="article_1" data-index="1">
        article1
      </div>
      <div class="article art_2" id="article_2" data-index="2">
        article2
      </div>
      <div class="article art_3" id="article_3" data-index="3">
        article3
      </div>
      <div class="article art_4" id="article_4" data-index="4">
        article4
      </div>
      <div class="article art_5" id="article_5" data-index="5">
        article5
      </div>
    </div>

    <script defer type="text/javascript">
      document.addEventListener("DOMContentLoaded", function(){
        var body_tag=document.body;
        var page_url=this.location.href.split('#')[0];
        var page_url_mark=this.location.href.split('#')[1];
        var page_mark_num;
        var tar;
        var sec=document.querySelector('.section');
        var art=document.querySelector('.article');
        var art_all=document.querySelectorAll('.article');
        var art_data_index=art.getAttribute('data-index');
        var art_height;
        var nav=document.querySelector('nav');
        var nav_li=document.querySelector('nav li');
        var nav_li_all=document.querySelectorAll('nav li');
        var nav_height=document.querySelector('nav').clientHeight;
        var nav_mobile_wrap=document.querySelector('.nav_mobile_wrap');
        var menu_idx;
        var art_idx;
        var i=1;
        var leng=art_all.length-1;
        var wh;
        var tl;
        var sce=false;
        var count;
        var old_count;
        var count_val;
        var y_start;
        var y_move;
        var y_value;
        var sel_this;
        var scroll_framespeed = 1000/60;
        var star_time = 300;
        var scroll_animation = null;
        var menu_btn = document.querySelector('.menu_btn');

        art_height=art.clientHeight;
        count=Math.round(((document.documentElement.scrollTop/window.innerHeight)))+1;
        if(count>art_all.length){
            count=art_all.length;
        }else if(count<1){
            count=1;
        };
        history.pushState(null,null,page_url+'#article_'+count);
        function start_page(){
          console.log('start_count = '+document.documentElement.scrollTop/window.innerHeight);
          tar=(art_height*(count-1));
          nav_li.classList.remove('on');
          nav_li_all[count-1].classList.add('on');
          setTimeout(function(){
            window.scrollTo(0,tar);
          },star_time);
          console.log(tar);
          console.log('art_count in. is = ' + count);
          console.log('url = '+page_url);
        };
        start_page();
        [].forEach.call(nav_li_all,function(sel_this){
          function nav_click(){
            event.preventDefault();
            event.stopPropagation();
            menu_idx=this.getAttribute('data-index');
            art_idx=art[Number(menu_idx)-1];
            art_height=art.clientHeight;
            count_val=(menu_idx-1);
            console.log(this);
            document.querySelector('nav .on').classList.remove('on');
            this.classList.add('on');
            console.log('.art_'+menu_idx);
            // 구버전
            // setTimeout(function(){
            //   window.scrollTo({left:0,top:art_height*count_val,behavior:'smooth'});
            // },star_time);

            function click_scroll_movement(){                
                // console.log('move =='+move);
                // scroll_animation = null;
                // setTimeout(function(){
                    // 
                    // if(scroll_animation){
                      // scroll_animation.cancel();
                    // };
                    // scroll_animation = document.querySelector('body').animate(
                      // [window.scrollTo({left:0,top:art_height*count_val,behavior:'smooth'})],
                      // {
                        // duration:200,
                        // easing:'ease-in-out',
                        // fill: 'forwards'
                      // }
                    // )
                    // scroll_animation.onfinish = function(){
                      // scroll_animation = null;
                    // };
                // },star_time);

                // window.scrollTo({left:0,top:art_height*count_val,behavior:'smooth'});

                document.querySelector('body').animate(
                    [window.scroll(0,art_height*count_val)],
                    {
                    duration:2000,
                    easing:'ease-in-out',
                    fill: 'forwards'
                    }
                )

                console.log('scroll move!!');
            };
            click_scroll_movement();
            count=menu_idx;
            // page_mark_num=page_url_mark.split('_')[1];
            history.pushState(null,null,page_url+'#article_'+count);
            };
            sel_this.addEventListener("click",nav_click,false);
        });
        
        function wheel_y(event){
          event.preventDefault();
          event.stopPropagation();
          var wd=event.wheelDelta;
          art_height=art.clientHeight;
          count_val=(count-1);

          console.log('wheel 0 = '+count);
          if (wd>20 && sce==false && count_val>0) {
            sce = true;
            count--;
            count_val--;
            console.log('wheel - = '+count+' / wd = '+wd);
          }else if (wd<20 && sce==false && count_val<=leng) {
            sce = true;
            if (count<=leng) {
              count++;
              count_val++;
            }else{
              count_val=leng;
            }
            console.log('wheel + = '+count);
          }
          move_art();
          history.pushState(null,null,page_url+'#article_'+(count));
          console.log('count-ride = '+count+' / wd = '+wd);
        };

        function drag_y(event){
          art_height=art.clientHeight;
          count_val=(count-1);
          y_value = y_start-y_move;
          if (y_value<50 && sce==false && count_val>0) {
            sce = true;
            count--;
            count_val--;
          }else if (y_value>50 && sce==false && count_val<=leng) {
            sce = true;
            if (count<=leng) {
              count++;
              count_val++;
            }else{
              count=leng+1;
            }
          }else{
            count=count+0;
            count_val=count_val+0;
          };
          move_art();
          history.pushState(null,null,page_url+'#article_'+(count));
        };

        function drag_start(event){
          event.preventDefault();
          event.stopPropagation();
          y_start=event.touches[0].pageY;
        };
        function drag_move(event){
          y_move=event.changedTouches[0].pageY;
          // drag_y();
        };
        function drag_end(event){
          y_move=event.changedTouches[0].pageY;
          drag_y();
        };
        function drag_cancel(event){
          y_move=event.changedTouches[0].pageY;
          drag_y();
        };

        function move_art(){
          count_val=(count-1);
          document.querySelector('nav .on').classList.remove('on');
          nav_li_all[count-1].classList.add('on');
          window.scrollTo(0,art_height*count_val);
          console.log('art_height*count_val = '+art_height*count_val)
          sce = false;
        };

        sec.addEventListener("mousewheel",wheel_y,false);
        sec.addEventListener("touchstart",drag_start,false);
        sec.addEventListener("touchmove",drag_move,false);
        sec.addEventListener("touchend",drag_end,false);
        sec.addEventListener("touchcancle",drag_cancel,false);

        menu_btn.addEventListener('click',menu_btn_click,false)

        function menu_btn_click(){
            console.log('menu_btn_click');
            if(menu_btn.classList.contains('menu_btn') && menu_btn.classList.contains('on')){
                nav_mobile_wrap.classList.remove('on');
                menu_btn.classList.remove('on');
                body_tag.style.overflowY='auto';

            }else{
                nav_mobile_wrap.classList.add('on');
                menu_btn.classList.add('on');
                body_tag.style.overflowY='hidden';

            }
        };

        function popstate_controll(){
          sce = true;
          if((this.location.href.split('#')[1]==null)||(this.location.href.split('#')[1]=='article_1')){
            count=1;
          }else if(this.location.href.split('#')[1]=='article_2'){
            count=2;
          }else if(this.location.href.split('#')[1]=='article_3'){
            count=3;
          }else if(this.location.href.split('#')[1]=='article_4'){
            count=4;
          }
          console.log('pop_'+count);
          count_val=(count-1);
          document.querySelector('nav .on').classList.remove('on');
          nav_li_all[count_val].classList.add('on');
          setTimeout(function(){
            window.scrollTo(0,art_height*count_val);
          },star_time);
          console.log('popstate count_val = '+count_val+' / art_height*count_val = '+art_height*count_val);
          sce = false;
          return false;
        };

        window.addEventListener('popstate',function(){
            popstate_controll();
        });

        window.addEventListener('resize', function(){
          var scroll_delay_time_1;
		      if(!scroll_delay_time_1){
            scroll_delay_time_1 = setTimeout(function(){
              scroll_delay_time_1=null;
              if(count>art_all.length){
                count=art_all.length;
              }else if(count<1){
                count=1;
              };
              history.pushState(null,null,page_url+'#article_'+count);
              art_height=art.clientHeight;
              console.log(' / count= '+count);
              tar=art_height*(count-1);
              nav_li.classList.remove('on');
              nav_li_all[count-1].classList.add('on');
              window.scrollTo(0,tar);
              console.log('nav_height = '+nav_height+' / count = '+count);
            },scroll_framespeed)
          };
        });

        /*-모달로그 창 위 컨텐츠의 포커스 요소만 순회하는 함수+esc키 눌렀을 때 모달로그 닫히기+낮은 단계의 레이어 선택 요소에 포커스 유지-*/
        function conbox_contents(){ // 높은 단계의 모달로그 컨텐츠의 포커스 요소만 순회 함수 + esc 키 눌렀을 시 닫히기
            if(document.getElementById('all-filter-conbox')){
                var conbox_contentswrap = document.getElementById('all-filter-conbox');
                var filter_conbox_contentswrap = document.getElementById('filter-conbox-contentswrap');

                $('.body-section-content, header, footer').find('[tabindex]').attr('tabindex','-1');
                $('#all-filter-conbox').find('[tabindex]').attr('tabindex','0');
                $('#all-filter-conbox').find('[tabindex]').eq(0).focus();
                
                conbox_contentswrap.addEventListener('keydown', function(e){
                    var this_on_focus;

                    var con_range = $('.all-filter-conbox, .conbox-contents-view').find('.filter-title-closebtn, .filter-conbox-contentswrap').find('a[href], area[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), button, button:not([disabled]), iframe, object, embed, *[tabindex], *[contenteditable]');
                    var con_first = con_range.eq(0);
                    var con_last = con_range.eq(con_range.length-1);
                    
                    var focus_content = 'a[href], area[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), button, button:not([disabled]), iframe, object, embed, *[tabindex], *[contenteditable]';
                    var conbox_content = conbox_contentswrap.querySelectorAll(focus_content);
                    var first_content = conbox_contentswrap.querySelectorAll(focus_content)[0];
                    var last_content = conbox_contentswrap.querySelectorAll(focus_content)[conbox_content.length-1];

                    console.log('last_content = '+conbox_content.length);

                    if (e.keyCode === 27){
                        focus_still();
                    }else{
                        this_on_focus = document.activeElement;
                        if ((e.keyCode===9 && !e.shiftKey)&&(this_on_focus==last_content)) {

                            console.log('pop ride this_1');
                            first_content.focus();
                        }
                        if((e.keyCode===9 && e.shiftKey)&&(this_on_focus==first_content)) {
                            console.log('pop ride this_2');
                            last_content.focus();
                        }
                    };
                    e.preventDefault();
                });

                filter_conbox_contentswrap.addEventListener('keydown', function(e){
                    var this_on_focus;

                    var con_range = $('.all-filter-conbox, .conbox-contents-view').find('.filter-title-closebtn, .filter-conbox-contentswrap').find('a[href], area[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), button, button:not([disabled]), iframe, object, embed, *[tabindex], *[contenteditable]');
                    var con_first = con_range.eq(0);
                    var con_last = con_range.eq(con_range.length-1);
                    
                    var focus_content = 'a[href], area[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), button, button:not([disabled]), iframe, object, embed, *[tabindex], *[contenteditable]';
                    var conbox_content = filter_conbox_contentswrap.querySelectorAll(focus_content);
                    var first_content = filter_conbox_contentswrap.querySelectorAll(focus_content)[0];
                    var last_content = filter_conbox_contentswrap.querySelectorAll(focus_content)[conbox_content.length-1];

                    console.log('last_content = '+conbox_content.length);

                    if (e.keyCode === 27){
                        focus_still();
                    }else{
                        this_on_focus = document.activeElement;
                        if ((e.keyCode===9 && !e.shiftKey)&&(this_on_focus==last_content)) {

                            console.log('pop ride this_1');
                            first_content.focus();
                        }
                        if((e.keyCode===9 && e.shiftKey)&&(this_on_focus==first_content)) {
                            console.log('pop ride this_2');
                            last_content.focus();
                        }
                        if (e.keyCode===13){
                            console.log('in a this ='+$(this).attr('class'));
                            if($(this).attr('class')==('.filter-title-closebtn')){
                                $('.filter-title-closebtn').click();
                            }else{
                                var link_a = $('.filter-conbox-contentswrap').children('.filter-conbox-contents').find('.contents-view-img').find('a').attr('href');
                                console.log('link_a = '+link_a);
                                window.open("about:blank").location.href = link_a;
                            };
                        }
                    };
                    e.preventDefault();
                });
            }
        };

        return false;
      });
    </script>
  </body>
</html>
